<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>六年級社會科線上練習大題庫（翰林6上）</title>
    <!-- 引入 Tailwind CSS 與 FontAwesome 圖標 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 flex flex-col items-center justify-center p-4 min-h-screen">

    <div class="w-full max-w-3xl bg-white rounded-2xl shadow-xl p-6 md:p-8 space-y-6">
        
        <!-- 標題區 -->
        <div class="text-center space-y-2">
            <h1 class="text-2xl md:text-3xl font-bold text-blue-600 flex items-center justify-center gap-2">
                <i class="fa-solid fa-graduation-cap"></i> 翰林 6 上社會科 線上練習大題庫
            </h1>
            <p class="text-slate-600 text-sm md:text-base">範圍：第 1、2 單元（100% 完整收錄 5 份單元卷 + 期中考甲、乙卷所有題型）</p>
        </div>

        <div id="setup-screen" class="space-y-6">
            <!-- 模式選擇 -->
            <div class="bg-slate-50 border border-slate-200 rounded-xl p-5 space-y-4">
                <div class="flex flex-col md:flex-row items-center justify-between gap-4">
                    <label for="question-count" class="font-semibold text-slate-700 text-lg flex items-center gap-2">
                        <i class="fa-solid fa-list-check text-blue-500"></i> 選擇測驗題數：
                    </label>
                    <select id="question-count" class="w-full md:w-auto min-w-[260px] px-4 py-2.5 bg-white border border-slate-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 text-slate-700 font-medium">
                        <option value="10">挑戰 10 題（快速隨機練習）</option>
                        <option value="25">挑戰 25 題（精選中量測驗）</option>
                        <option value="50">挑戰 50 題（考前實力衝刺）</option>
                        <option value="all" selected>挑戰全部完整題庫（共 162 題）</option>
                    </select>
                </div>
            </div>

            <!-- 開始按鈕 -->
            <button onclick="startQuiz()" class="w-full py-3.5 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl shadow-lg transition duration-200 flex items-center justify-center gap-2 text-lg">
                <i class="fa-solid fa-play"></i> 開始新測驗
            </button>
        </div>

        <!-- 測驗進行畫面 (預設隱藏) -->
        <div id="quiz-screen" class="hidden space-y-6">
            <div class="flex justify-between items-center border-b pb-3">
                <span id="progress-text" class="text-slate-500 font-medium">題目 1 / 10</span>
                <span id="score-text" class="text-blue-600 font-bold">答對題數：0 題（得分：0 分）</span>
            </div>

            <div id="question-container" class="space-y-4">
                <!-- 動態載入題目 -->
            </div>

            <!-- 詳解區 (作答後顯示) -->
            <div id="explanation-box" class="hidden bg-sky-50 border border-sky-200 rounded-xl p-4 text-slate-700 space-y-1">
                <div class="font-bold text-sky-800 flex items-center gap-1.5">
                    <i class="fa-solid fa-circle-info"></i> 觀念解析：
                </div>
                <p id="explanation-text" class="text-sm md:text-base"></p>
            </div>

            <div class="flex justify-end pt-2">
                <button id="next-btn" onclick="nextQuestion()" class="hidden px-6 py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl shadow transition duration-200">
                    下一題 <i class="fa-solid fa-arrow-right ml-1"></i>
                </button>
            </div>
        </div>

        <!-- 結算畫面 (預設隱藏) -->
        <div id="result-screen" class="hidden text-center space-y-6 py-6">
            <div class="space-y-2">
                <h2 class="text-3xl font-bold text-slate-800">🎉 測驗完成！</h2>
                <p id="final-score" class="text-2xl font-bold text-blue-600"></p>
                <p id="final-detail" class="text-slate-600"></p>
            </div>
            <button onclick="resetQuiz()" class="px-8 py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl shadow-lg transition duration-200">
                <i class="fa-solid fa-rotate-right mr-1"></i> 重新測驗
            </button>
        </div>

        <!-- 分享與網址區 -->
        <div class="bg-slate-50 border border-slate-200 rounded-xl p-4 flex flex-col md:flex-row items-center justify-between gap-3">
            <span class="text-sm font-medium text-slate-600 flex items-center gap-2">
                <i class="fa-solid fa-globe text-blue-500"></i> 分享測驗網址：
            </span>
            <div class="flex w-full md:w-auto gap-2">
                <input type="text" id="share-url" readonly value="https://sanny874102.github.io/social-study/" class="w-full md:w-80 px-3 py-1.5 bg-white border border-slate-300 rounded-lg text-sm text-slate-600 focus:outline-none">
                <button onclick="copyUrl()" class="px-4 py-1.5 bg-sky-600 hover:bg-sky-700 text-white text-sm font-medium rounded-lg shadow transition flex items-center gap-1 shrink-0">
                    <i class="fa-solid fa-copy"></i> 複製網址
                </button>
            </div>
        </div>

    </div>

    <script>
        // 翰林版六年級上學期社會科（第1、2單元）完整162題大題庫
        const allQuestions = [
            // ================= 單元1-1：消費如何聰明選擇並守護權益？ =================
            { type: "TF", q: "買到問題商品，不需要注意期限，只要憑發票、保證書或購買證明就可以向賣家要求退費或換貨。", ans: false, explanation: "買到問題商品必須在「規定期限內」，憑發票、保證書或購買證明向賣家要求退費或換貨。" },
            { type: "TF", q: "兌換其他國家的貨幣時，必須根據當日匯率估算可以兌換的金額。", ans: true, explanation: "匯率會隨時變動，因此兌換外幣時需根據當日匯率來估算金額。" },
            { type: "TF", q: "消費者優先購買友善環境的商品與服務，也是愛護環境的行為之一。", ans: true, explanation: "透過綠色消費、優先選購友善環境的商品，能減少環境負擔。" },
            { type: "TF", q: "培養理性的消費習慣是「先購買再規劃」，這樣可以避免需要的時候沒有東西可以用。", ans: false, explanation: "理性的消費習慣應該是「先規劃、再購買」，才能避免支出超出預算。" },
            { type: "TF", q: "商品的價格、品質和個人需求，會影響消費者選擇和購買的意願。", ans: true, explanation: "消費者在購物時，通常會綜合考量價格、品質與個人需求。" },
            { type: "TF", q: "臺灣目前除了現金，還有信用卡、電子票證、行動支付等支付方式。", ans: true, explanation: "現代社會發展出多元便利的非現金支付工具。" },
            { type: "TF", q: "面對不同消費偏好，生產者生產單一的商品，更能吸引消費者注意。", ans: false, explanation: "面對多元的消費偏好，生產者應提供「多樣化」的商品或服務才能吸引不同消費者。" },
            { type: "TF", q: "將舊衣物重新設計並改造成環保又時尚的手提袋，也是愛護物品的方式之一。", ans: true, explanation: "舊物改造再利用能延長物品壽命，減少資源浪費與垃圾。" },
            { type: "MC", q: "關於貨幣與匯率的敘述，下列何者錯誤？", options: ["匯率通常是固定不變的", "匯率可以用來估算兌換的金額", "在日本當地通常使用日圓", "在美國當地通常使用美元"], ans: 0, explanation: "匯率會隨著國際經濟情勢而經常變動，並非固定不變。" },
            { type: "MC", q: "「新產品看起來很好吃。」由這句話可以知道這個消費者選擇的因素是下列何者？", options: ["商品價格", "市場需求", "個人需求", "商品利潤"], ans: 2, explanation: "因為自己覺得看起來好吃而想嘗試新產品，屬於「個人需求與偏好」。" },
            { type: "MC", q: "晨光早餐店的蛋餅因蛋價上漲而調漲5元，阿賢因此選擇在家準備早餐。這是因為下列哪一個因素而使阿賢做出改變？", options: ["商品品質", "個人需求", "商品價格", "商品成分"], ans: 2, explanation: "因為蛋餅調漲5元而改變消費選擇，是受到「商品價格」因素影響。" },
            { type: "MC", q: "生產者可以透過下列什麼管道傳遞商品資訊？", options: ["廣告看板", "電視", "網路平臺", "以上皆可"], ans: 3, explanation: "廣告看板、電視與網路平臺都是生產者傳遞商品資訊的常見管道。" },
            { type: "MC", q: "「企業快速且大量生產價格低、款式新穎的商品，吸引消費者大量購買。」以上這段敘述說明的是下列哪一個行為？", options: ["過度開發", "過度生產", "理性生產", "理性買賣"], ans: 1, explanation: "快速且大量生產低價商品促銷，容易造成資源浪費與「過度生產」的問題。" },
            { type: "MC", q: "小莉希望消費時能盡量做到環境友善，下列哪一個敘述不太可能是小莉買包包時的選擇？", options: ["購買使用化學染劑製成的包包", "選擇由舊衣改造的包包", "買百分之百有機棉花製作的包包", "從二手平臺購買包包"], ans: 0, explanation: "化學染劑容易對水源與環境造成汙染，不符合環境友善的消費原則。" },
            // 單元1-1 第三、四大題轉化題
            { type: "TF", q: "【消費與生產】對生產者來說，透過創意廣告吸引消費者注意都是無效的。", ans: false, explanation: "創意廣告能有效吸引消費者目光，傳遞商品特色以促進銷售。" },
            { type: "TF", q: "【消費與生產】對生產者來說，若要控制成本，可以選擇價格低的劣質原料。", ans: false, explanation: "生產者應兼顧商品品質與安全，不可為了降低成本而使用劣質原料傷害消費者權益。" },
            { type: "TF", q: "【消費與生產】對生產者來說，使用問卷蒐集消費者意見可以幫助了解市場的需求。", ans: true, explanation: "透過問卷調查可以了解消費者的偏好與需求，進而改良商品。" },
            { type: "TF", q: "【消費與生產】對消費者來說，每個人的需求都不同；有的在意品質，有的在意價格，有的在意設計款式。", ans: true, explanation: "每位消費者的重視條件與個人需求皆不相同。" },
            { type: "TF", q: "【消費與生產】對消費者來說，套餐的優惠價格無法促進購買。", ans: false, explanation: "優惠價格能降低購買成本，常能吸引消費者並促進購買意願。" },
            { type: "TF", q: "【消費與生產】對消費者來說，選擇新產品是一種個人需求。", ans: true, explanation: "喜歡嘗試新產品屬於個人的消費偏好與需求。" },
            { type: "TF", q: "【消費安全與權益】消費前，先蒐集相關資訊，查詢賣家的評價和信用，有助於維護消費安全。", ans: true, explanation: "事前查詢評價與信用可避免遇到不良賣家或消費詐騙。" },
            { type: "TF", q: "【消費安全與權益】消費時，僅考慮商品價格，商品說明、規格與標示則不用考慮。", ans: false, explanation: "消費時必須仔細閱讀商品說明、規格與合格標示，才能保障安全與權益。" },
            { type: "TF", q: "【消費安全與權益】遇到可疑訊息，可以撥打「165反詐騙諮詢專線」求證。", ans: true, explanation: "165為警政署反詐騙諮詢專線，可隨時查證可疑購物訊息。" },
            { type: "TF", q: "【消費安全與權益】發生消費糾紛時，可以撥打「全國消費者服務專線1990」求證。", ans: false, explanation: "全國消費者服務專線是「1950」，而非1990。" },
            { type: "TF", q: "【消費安全與權益】消費時，仔細閱讀商品說明、規格與標示等資訊，並向業者索取品質保證書或相關證明，有助於維護自身權益。", ans: true, explanation: "保留發票、品質保證書與購買證明，才能在發生消費糾紛時保障退換貨權益。" },

            // ================= 單元1-2：為什麼要理財規劃與評估風險？ =================
            { type: "TF", q: "記錄收入與支出的方式目前只有紙本記帳一種類型。", ans: false, explanation: "除了傳統紙本記帳，現在也有電腦軟體、手機記帳App等多元工具。" },
            { type: "TF", q: "日常生活中，家人之間有時會面臨消費取捨的問題，因此家庭需透過理財規劃，調整支出的優先順序。", ans: true, explanation: "家庭收入有限，透過理財規劃並區分「必要支出」與「想要購買」，能妥善安排先後順序。" },
            { type: "TF", q: "我們可以透過閱讀報章雜誌、收看財經報導、查詢網路資訊等方式，蒐集理財相關資料。", ans: true, explanation: "多方蒐集正確的財經資訊有助於做出明智的理財決策。" },
            { type: "TF", q: "爸爸媽媽將薪水的一部分拿去購買股票，可以算是一種投資的方式。", ans: true, explanation: "購買股票屬於常見的投資理財方式之一。" },
            { type: "TF", q: "了解家人如何分配金錢並進行理財規劃後，學生能試著分配使用自己的零用錢、紅包或獎學金。", ans: true, explanation: "學生也能從管理自己的零用錢與紅包開始練習儲蓄與理財規劃。" },
            { type: "TF", q: "規劃理財方式時，不需評估風險，直接從活期存款、定期存款、保險或股票，選其中一項投資就好。", ans: false, explanation: "理財前必須先評估自身能承擔的風險，並可搭配不同工具分散風險。" },
            { type: "TF", q: "選定理財方式後，不用定期檢視。", ans: false, explanation: "選定理財方式後仍應定期檢視成效，並依家庭狀況與市場變化適時調整。" },
            { type: "TF", q: "理財可能帶來獲利，也可能出現虧損，所以理財需要承擔風險。", ans: true, explanation: "投資理財皆有風險，獲利潛力愈高的工具通常伴隨的虧損風險也愈大。" },
            { type: "MC", q: "在小俊的記帳項目中，下列哪一項性質和其他三者不同？", options: ["銀行存款獲得利息1,000元", "賣出股票賺進50,000元", "購買便當150元", "領到薪水32,000元"], ans: 2, explanation: "購買便當屬於「支出」，其餘三項（利息、股票獲利、薪水）皆屬於「收入」。" },
            { type: "MC", q: "下列有關股票的敘述，何者錯誤？", options: ["價格上漲時，有機會獲得較高的收益", "價格波動較定期存款小", "價格波動較定期存款大", "有虧損的風險"], ans: 1, explanation: "股票的價格波動比銀行定期存款大得多，風險也較高。" },
            { type: "MC", q: "小廷了解家人如何進行理財後，想要嘗試規劃自己的零用錢。如果小廷想要持續增加自己可以規劃和運用的金錢，下列哪一個做法較不適當？", options: ["將收入與支出如實記錄下來", "努力學習和累積理財知識", "和家人討論適合的存錢方式", "先消費再規劃如何使用金錢"], ans: 3, explanation: "應該「先規劃再消費」，若先消費再規劃容易導致金錢透支或花光。" },
            { type: "MC", q: "小桃一家討論家中財務分配，哪一個人的觀念較不適合？", options: ["媽媽想將一些錢存起來當作緊急預備金，減少未來臨時需要大筆金錢時帶來的衝擊", "爸爸希望有一本共同的家庭記帳本，用來了解金錢的去向", "小桃聽說股票賺錢快，建議家人直接把所有儲蓄轉成投資股票", "妹妹建議家人除了彼此討論外，也可以諮詢專業理財人員"], ans: 2, explanation: "股票風險高，不應把所有儲蓄全部投入股票，必須保留緊急預備金並分散風險。" },
            { type: "MC", q: "小哲檢視自己的消費紀錄，請問下列哪一項花費可能被歸類在「想要購買」？", options: ["參加旅遊團", "水電費", "存緊急預備金", "房租費用"], ans: 0, explanation: "水電費、房租與緊急預備金是維持生活與安全的必要項目，參加旅遊團屬於休閒娛樂的「想要購買」。" },
            // 單元1-2 第三、四大題轉化題
            { type: "TF", q: "【理財行為判斷】「拿到錢就把錢花光」是有助於理財規劃與實現的正確行為。", ans: false, explanation: "拿到錢應先規劃儲蓄與必要支出，直接花光無法累積財富。" },
            { type: "TF", q: "【理財行為判斷】將一些錢存在銀行中賺取利息，有助於理財規劃與實現。", ans: true, explanation: "銀行存款風險低且能穩定賺取利息。" },
            { type: "TF", q: "【理財行為判斷】減少非必要支出也是存錢的一種方式。", ans: true, explanation: "減少「想要」的非必要開銷，能存下更多可運用的資金。" },
            { type: "TF", q: "【理財行為判斷】投資前，應先評估自己能承擔的風險。", ans: true, explanation: "了解自身風險承受度才能選擇合適的理財工具。" },
            { type: "TF", q: "【理財行為判斷】養成記帳的習慣也屬於理財能力之一。", ans: true, explanation: "記帳能幫助掌握收支狀況，是理財的重要基礎。" },
            { type: "TF", q: "【理財行為判斷】依照需求決定支出的優先順序，有助於妥善理財。", ans: true, explanation: "優先支付「必要支出」，有餘裕再考慮「想要支出」。" },

                qData.options.forEach((opt, idx) => {
                    optionsHtml += `
                        <button onclick="checkAnswer(${idx}, this)" class="w-full text-left p-4 bg-slate-50 hover:bg-blue-50 border border-slate-200 rounded-xl font-medium text-slate-700 transition flex items-center gap-3">
                            <span class="w-8 h-8 rounded-full bg-white border border-slate-300 flex items-center justify-center font-bold text-slate-500 shrink-0">${idx + 1}</span> <span>${opt}</span>
                        </button>
                    `;
                });

                container.innerHTML = `
                    <h3 class="text-lg md:text-xl font-bold text-slate-800 mb-4 whitespace-pre-line">${currentIndex + 1}. （選擇題）${qData.q}</h3>
                    <div class="space-y-3">
                        ${optionsHtml}
                    </div>
                `;
            }
        }

        function checkAnswer(userAnswer, btnElement) {
            if (selectedOption !== null) return;
            selectedOption = userAnswer;

            const qData = currentQuizQuestions[currentIndex];
            const isCorrect = (userAnswer === qData.ans);

            const buttons = document.querySelectorAll('#question-container button');
            buttons.forEach(btn => btn.disabled = true);

            if (isCorrect) {
                correctCount++;
                btnElement.classList.remove('bg-slate-50', 'hover:bg-blue-50');
                btnElement.classList.add('bg-emerald-100', 'border-emerald-500', 'text-emerald-800');
                btnElement.querySelector('span').classList.add('bg-emerald-500', 'text-white');
            } else {
                btnElement.classList.remove('bg-slate-50', 'hover:bg-blue-50');
                btnElement.classList.add('bg-rose-100', 'border-rose-500', 'text-rose-800');
                btnElement.querySelector('span').classList.add('bg-rose-500', 'text-white');

                buttons.forEach((btn, idx) => {
                    if (qData.type === "TF") {
                        if ((idx === 0 && qData.ans === true) || (idx === 1 && qData.ans === false)) {
                            btn.classList.remove('bg-slate-50');
                            btn.classList.add('bg-emerald-100', 'border-emerald-500', 'text-emerald-800');
                        }
                    } else {
                        if (idx === qData.ans) {
                            btn.classList.remove('bg-slate-50');
                            btn.classList.add('bg-emerald-100', 'border-emerald-500', 'text-emerald-800');
                        }
                    }
                });
            }

            // 顯示詳細解說
            document.getElementById('explanation-text').innerText = qData.explanation;
            document.getElementById('explanation-box').classList.remove('hidden');

            document.getElementById('score-text').innerText = `答對：${correctCount} 題（目前得分：${getCurrentScore()} 分）`;
            document.getElementById('next-btn').classList.remove('hidden');
        }

        function nextQuestion() {
            currentIndex++;
            if (currentIndex < currentQuizQuestions.length) {
                loadQuestion();
            } else {
                document.getElementById('quiz-screen').classList.add('hidden');
                document.getElementById('result-screen').classList.remove('hidden');
                document.getElementById('final-score').innerText = `您的總得分：${getCurrentScore()} 分`;
                document.getElementById('final-detail').innerText = `共挑戰 ${currentQuizQuestions.length} 題，答對 ${correctCount} 題`;
            }
        }

        function resetQuiz() {
            document.getElementById('setup-screen').classList.remove('hidden');
            document.getElementById('quiz-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.add('hidden');
        }

        function copyUrl() {
            const urlInput = document.getElementById('share-url');
            urlInput.select();
            urlInput.setSelectionRange(0, 99999);
            navigator.clipboard.writeText(urlInput.value);
            alert('網址已成功複製！');
        }
    </script>
</body>
</html>
