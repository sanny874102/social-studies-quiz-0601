<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>六年級社會科線上練習大題庫（翰林6上）</title>
    <!-- 引入 Tailwind CSS 與 FontAwesome 圖標 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 flex flex-col items-center justify-center p-4 min-h-screen">

    <div class="w-full max-w-3xl bg-white rounded-2xl shadow-xl p-6 md:p-8 space-y-6">
        
        <!-- 標題區 -->
        <div class="text-center space-y-2">
            <h1 class="text-2xl md:text-3xl font-bold text-blue-600 flex items-center justify-center gap-2">
                <i class="fa-solid fa-graduation-cap"></i> 翰林 6 上社會科 線上練習大題庫
            </h1>
            <p class="text-slate-600 text-sm md:text-base">範圍：第 1、2 單元（100% 完整收錄 5 份單元卷 + 期中考甲、乙卷所有題型）</p>
        </div>

        <div id="setup-screen" class="space-y-6">
            <!-- 模式選擇 -->
            <div class="bg-slate-50 border border-slate-200 rounded-xl p-5 space-y-4">
                <div class="flex flex-col md:flex-row items-center justify-between gap-4">
                    <label for="question-count" class="font-semibold text-slate-700 text-lg flex items-center gap-2">
                        <i class="fa-solid fa-list-check text-blue-500"></i> 選擇測驗題數：
                    </label>
                    <select id="question-count" class="w-full md:w-auto min-w-[260px] px-4 py-2.5 bg-white border border-slate-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 text-slate-700 font-medium">
                        <option value="10">挑戰 10 題（快速隨機練習）</option>
                        <option value="25">挑戰 25 題（精選中量測驗）</option>
                        <option value="50">挑戰 50 題（考前實力衝刺）</option>
                        <option value="all" selected>挑戰全部完整題庫（共 162 題）</option>
                    </select>
                </div>
            </div>

            <!-- 開始按鈕 -->
            <button onclick="startQuiz()" class="w-full py-3.5 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl shadow-lg transition duration-200 flex items-center justify-center gap-2 text-lg">
                <i class="fa-solid fa-play"></i> 開始新測驗
            </button>
        </div>

        <!-- 測驗進行畫面 (預設隱藏) -->
        <div id="quiz-screen" class="hidden space-y-6">
            <div class="flex justify-between items-center border-b pb-3">
                <span id="progress-text" class="text-slate-500 font-medium">題目 1 / 10</span>
                <span id="score-text" class="text-blue-600 font-bold">答對題數：0 題（得分：0 分）</span>
            </div>

            <div id="question-container" class="space-y-4">
                <!-- 動態載入題目 -->
            </div>

            <!-- 詳解區 (作答後顯示) -->
            <div id="explanation-box" class="hidden bg-sky-50 border border-sky-200 rounded-xl p-4 text-slate-700 space-y-1">
                <div class="font-bold text-sky-800 flex items-center gap-1.5">
                    <i class="fa-solid fa-circle-info"></i> 觀念解析：
                </div>
                <p id="explanation-text" class="text-sm md:text-base"></p>
            </div>

            <div class="flex justify-end pt-2">
                <button id="next-btn" onclick="nextQuestion()" class="hidden px-6 py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl shadow transition duration-200">
                    下一題 <i class="fa-solid fa-arrow-right ml-1"></i>
                </button>
            </div>
        </div>

        <!-- 結算畫面 (預設隱藏) -->
        <div id="result-screen" class="hidden text-center space-y-6 py-6">
            <div class="space-y-2">
                <h2 class="text-3xl font-bold text-slate-800">🎉 測驗完成！</h2>
                <p id="final-score" class="text-2xl font-bold text-blue-600"></p>
                <p id="final-detail" class="text-slate-600"></p>
            </div>
            <button onclick="resetQuiz()" class="px-8 py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl shadow-lg transition duration-200">
                <i class="fa-solid fa-rotate-right mr-1"></i> 重新測驗
            </button>
        </div>

        <!-- 分享與網址區 -->
        <div class="bg-slate-50 border border-slate-200 rounded-xl p-4 flex flex-col md:flex-row items-center justify-between gap-3">
            <span class="text-sm font-medium text-slate-600 flex items-center gap-2">
                <i class="fa-solid fa-globe text-blue-500"></i> 分享測驗網址：
            </span>
            <div class="flex w-full md:w-auto gap-2">
                <input type="text" id="share-url" readonly value="https://sanny874102.github.io/social-study/" class="w-full md:w-80 px-3 py-1.5 bg-white border border-slate-300 rounded-lg text-sm text-slate-600 focus:outline-none">
                <button onclick="copyUrl()" class="px-4 py-1.5 bg-sky-600 hover:bg-sky-700 text-white text-sm font-medium rounded-lg shadow transition flex items-center gap-1 shrink-0">
                    <i class="fa-solid fa-copy"></i> 複製網址
                </button>
            </div>
        </div>

    </div>

    <script>
        // 翰林版六年級上學期社會科（第1、2單元）完整162題大題庫
        const allQuestions = [
            // ================= 單元1-1：消費如何聰明選擇並守護權益？ =================
            { type: "TF", q: "買到問題商品，不需要注意期限，只要憑發票、保證書或購買證明就可以向賣家要求退費或換貨。", ans: false, explanation: "買到問題商品必須在「規定期限內」，憑發票、保證書或購買證明向賣家要求退費或換貨。" },
            { type: "TF", q: "兌換其他國家的貨幣時，必須根據當日匯率估算可以兌換的金額。", ans: true, explanation: "匯率會隨時變動，因此兌換外幣時需根據當日匯率來估算金額。" },
            { type: "TF", q: "消費者優先購買友善環境的商品與服務，也是愛護環境的行為之一。", ans: true, explanation: "透過綠色消費、優先選購友善環境的商品，能減少環境負擔。" },
            { type: "TF", q: "培養理性的消費習慣是「先購買再規劃」，這樣可以避免需要的時候沒有東西可以用。", ans: false, explanation: "理性的消費習慣應該是「先規劃、再購買」，才能避免支出超出預算。" },
            { type: "TF", q: "商品的價格、品質和個人需求，會影響消費者選擇和購買的意願。", ans: true, explanation: "消費者在購物時，通常會綜合考量價格、品質與個人需求。" },
            { type: "TF", q: "臺灣目前除了現金，還有信用卡、電子票證、行動支付等支付方式。", ans: true, explanation: "現代社會發展出多元便利的非現金支付工具。" },
            { type: "TF", q: "面對不同消費偏好，生產者生產單一的商品，更能吸引消費者注意。", ans: false, explanation: "面對多元的消費偏好，生產者應提供「多樣化」的商品或服務才能吸引不同消費者。" },
            { type: "TF", q: "將舊衣物重新設計並改造成環保又時尚的手提袋，也是愛護物品的方式之一。", ans: true, explanation: "舊物改造再利用能延長物品壽命，減少資源浪費與垃圾。" },
            { type: "MC", q: "關於貨幣與匯率的敘述，下列何者錯誤？", options: ["匯率通常是固定不變的", "匯率可以用來估算兌換的金額", "在日本當地通常使用日圓", "在美國當地通常使用美元"], ans: 0, explanation: "匯率會隨著國際經濟情勢而經常變動，並非固定不變。" },
            { type: "MC", q: "「新產品看起來很好吃。」由這句話可以知道這個消費者選擇的因素是下列何者？", options: ["商品價格", "市場需求", "個人需求", "商品利潤"], ans: 2, explanation: "因為自己覺得看起來好吃而想嘗試新產品，屬於「個人需求與偏好」。" },
            { type: "MC", q: "晨光早餐店的蛋餅因蛋價上漲而調漲5元，阿賢因此選擇在家準備早餐。這是因為下列哪一個因素而使阿賢做出改變？", options: ["商品品質", "個人需求", "商品價格", "商品成分"], ans: 2, explanation: "因為蛋餅調漲5元而改變消費選擇，是受到「商品價格」因素影響。" },
            { type: "MC", q: "生產者可以透過下列什麼管道傳遞商品資訊？", options: ["廣告看板", "電視", "網路平臺", "以上皆可"], ans: 3, explanation: "廣告看板、電視與網路平臺都是生產者傳遞商品資訊的常見管道。" },
            { type: "MC", q: "「企業快速且大量生產價格低、款式新穎的商品，吸引消費者大量購買。」以上這段敘述說明的是下列哪一個行為？", options: ["過度開發", "過度生產", "理性生產", "理性買賣"], ans: 1, explanation: "快速且大量生產低價商品促銷，容易造成資源浪費與「過度生產」的問題。" },
            { type: "MC", q: "小莉希望消費時能盡量做到環境友善，下列哪一個敘述不太可能是小莉買包包時的選擇？", options: ["購買使用化學染劑製成的包包", "選擇由舊衣改造的包包", "買百分之百有機棉花製作的包包", "從二手平臺購買包包"], ans: 0, explanation: "化學染劑容易對水源與環境造成汙染，不符合環境友善的消費原則。" },
            // 單元1-1 第三、四大題轉化題
            { type: "TF", q: "【消費與生產】對生產者來說，透過創意廣告吸引消費者注意都是
